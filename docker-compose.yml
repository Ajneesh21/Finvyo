services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finvyo-web
    restart: no
    deploy:
      resources:
        limits:
          memory: 1gb
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      - redis
    volumes:
      - app-storage:/app/data

  redis:
    image: redis:8-alpine
    container_name: finvyo-redis
    restart: no
    deploy:
      resources:
        limits:
          memory: 256mb
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  app-storage:
  redis-data:
