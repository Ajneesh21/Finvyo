services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finvyo-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1gb
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--disable-proto=delete
      - REDIS_URL=redis://:${REDIS_PASSWORD:-finvyo_dev_pass}@redis:6379
      - PORT=3000
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  redis:
    image: redis:8-alpine
    container_name: finvyo-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256mb
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-finvyo_dev_pass}
    volumes:
      - redis-data:/data

volumes:
  redis-data:
